name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    # Weekly run on the default branch keeps its caches warm (GitHub evicts caches
    # unused for 7 days); PRs can only restore caches from their own ref or main.
    - cron: '0 6 * * 0'

# Cancel superseded runs of the same PR; never cancel main, tag or scheduled runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Bump to invalidate every cached native binary and configure result (e.g. after a
  # runner toolchain change that native/** does not capture).
  NATIVE_CACHE_VERSION: v1
  LLVM_MINGW_VERSION: '20240619'
  # xz 5.8.2 was built with automake 1.18.1 and autoconf 2.72
  AUTOCONF_VERSION: '2.72'
  AUTOCONF_SHA256: ba885c1319578d6c94d46e9b0dceb4014caafe2490e437a0dbca3f270a223f5a
  AUTOMAKE_VERSION: '1.18.1'
  AUTOMAKE_SHA256: 168aa363278351b89af56684448f525a5bce5079d0b6842bd910fdd3f1646887

jobs:
  # Look up the cached macOS dylib on Ubuntu so a macOS runner is only requested when
  # the dylib actually needs rebuilding (macOS runners are scarcer and less reliable).
  macos-cache:
    name: Check cached macOS dylib
    runs-on: ubuntu-24.04
    outputs:
      hit: ${{ steps.native-cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      # Tag builds always rebuild from source so release binaries never come from a cache.
      - name: Restore cached macOS dylib
        id: native-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: native-out/libarchive.dylib
          key: native-osx-universal-${{ env.NATIVE_CACHE_VERSION }}-${{ hashFiles('native/**') }}
          # Saved on macOS, restored on Ubuntu; the save step sets the same flag.
          enableCrossOsArchive: true
      - name: Archive macOS library
        if: steps.native-cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-osx-universal
          path: native-out/libarchive.dylib
          if-no-files-found: error
          retention-days: 1

  macos:
    # This exact name is a required status check in the branch protection for main: do not
    # rename it (even its capitalisation) without updating the rule.
    name: Build MacOS dylib (x86-64 and arm64)
    needs: [macos-cache]
    if: needs.macos-cache.outputs.hit != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Cache library downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~/downloads
          key: library-downloads-${{ hashFiles('native/build-config.sh') }}
          restore-keys: |
            library-downloads-
      - name: Cache configure results
        uses: actions/cache@v6.1.0
        with:
          path: ~/config-cache
          # Exact match only: a configure cache from another toolchain or flag set makes
          # autoconf abort ("`CC' has changed since the previous run").
          key: config-cache-macos-${{ env.NATIVE_CACHE_VERSION }}-${{ hashFiles('native/build-*.sh') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: macos-build-v2
        env:
          CCACHE_COMPILERCHECK: mtime
      - name: Build
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export CC="ccache clang"
          export CXX="ccache clang++"

          echo "=== ccache stats before build ==="
          ccache -s

          ./native/build-macos.sh

          echo "=== ccache stats after build ==="
          ccache -s

          mkdir -p native-out
          cp ~/libarchive-native/libarchive.dylib native-out/
      - name: Save native binary to cache
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/save@v6.1.0
        with:
          path: native-out/libarchive.dylib
          key: native-osx-universal-${{ env.NATIVE_CACHE_VERSION }}-${{ hashFiles('native/**') }}
          enableCrossOsArchive: true
      - name: Archive macOS library
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-osx-universal
          path: native-out/libarchive.dylib
          if-no-files-found: error
          retention-days: 1

  native:
    name: Build native ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86,   kind: linux,   script: build-linux-x86.sh,   output: libarchive-linux-x86.so }
          - { target: linux-x64,   kind: linux,   script: build-linux.sh,       output: libarchive-linux-x64.so }
          - { target: linux-arm64, kind: linux,   script: build-linux-arm64.sh, output: libarchive-linux-arm64.so }
          - { target: linux-arm,   kind: linux,   script: build-linux-arm.sh,   output: libarchive-linux-arm.so }
          - { target: win-x86,     kind: windows, arch: x86,                    output: archive-x86.dll }
          - { target: win-x64,     kind: windows, arch: x64,                    output: archive-x64.dll }
          - { target: win-arm64,   kind: windows, arch: arm64,                  output: archive-arm64.dll }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Compute cache keys
        id: cache-key
        run: |
          # LLVM-MinGW only matters to win-arm64, so only that target's keys carry it.
          EXTRA=""
          if [ "${{ matrix.target }}" = "win-arm64" ]; then
            EXTRA="llvm-mingw-${LLVM_MINGW_VERSION}-"
          fi
          {
            echo "key=native-${{ matrix.target }}-${EXTRA}${NATIVE_CACHE_VERSION}-${{ hashFiles('native/**') }}"
            # Configure results are only valid for the toolchain that produced them, so
            # their key carries the same toolchain parts as the binary's.
            echo "config-key=config-cache-${{ matrix.target }}-${EXTRA}${NATIVE_CACHE_VERSION}-${{ hashFiles('native/build-*.sh') }}"
          } >> "$GITHUB_OUTPUT"
      # Native binaries are reused while native/** is unchanged. Tag builds always
      # rebuild from source so release binaries never come from a cache.
      - name: Restore cached native binary
        id: native-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: native-out/${{ matrix.output }}
          key: ${{ steps.cache-key.outputs.key }}
      - name: Cache library downloads
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/downloads
          key: library-downloads-${{ hashFiles('native/build-config.sh') }}
          restore-keys: |
            library-downloads-
      - name: Cache configure results
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/config-cache
          # Exact match only: a configure cache from another toolchain or flag set makes
          # autoconf abort ("`CC' has changed since the previous run").
          key: ${{ steps.cache-key.outputs.config-key }}
      - name: Install apt packages
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          # The lzop shim is C++. mingw-w64 brings only the C compilers here, so add the
          # C++ ones, in the "win32" thread model of the default C compilers.
          packages: ${{ matrix.kind == 'windows' && 'mingw-w64 g++-mingw-w64-i686-win32 g++-mingw-w64-x86-64-win32 pkg-config' || 'pkg-config' }}
          version: 1.0
          execute_install_scripts: true
      - name: Install LLVM-MinGW for ARM64
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.target == 'win-arm64'
        run: |
          LLVM_MINGW="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64"
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW}.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${LLVM_MINGW}/bin" >> "$GITHUB_PATH"
      - name: Verify MinGW compilers are installed
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.kind == 'windows'
        run: |
          case "${{ matrix.arch }}" in
            x86)   CC=i686-w64-mingw32-gcc ;;
            x64)   CC=x86_64-w64-mingw32-gcc ;;
            arm64) CC=aarch64-w64-mingw32-gcc ;;
          esac
          which "$CC" "${CC%gcc}g++"
      - name: Cache autotools
        id: autotools-cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local
          key: autotools-ubuntu-24.04-autoconf-${{ env.AUTOCONF_VERSION }}-automake-${{ env.AUTOMAKE_VERSION }}
      - name: Install autoconf and automake
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.autotools-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          # Download with checksum verification; fall back to canonical ftp.gnu.org
          # if a mirror serves a bad/corrupt file.
          fetch_gnu() {
            local path="$1" sha="$2" out="$3"
            for url in "https://ftpmirror.gnu.org/gnu/$path" "https://ftp.gnu.org/gnu/$path"; do
              echo "Fetching $url"
              curl -fsSL --retry 3 --retry-delay 5 "$url" -o "$out" || continue
              if echo "$sha  $out" | sha256sum -c --status; then
                echo "Checksum OK from $url"
                return 0
              fi
              echo "Checksum mismatch from $url, trying next source"
              rm -f "$out"
            done
            echo "All sources failed for $path" >&2
            return 1
          }
          for tool in autoconf automake; do
            if [ "$tool" = autoconf ]; then
              ver="$AUTOCONF_VERSION"; sha="$AUTOCONF_SHA256"
            else
              ver="$AUTOMAKE_VERSION"; sha="$AUTOMAKE_SHA256"
            fi
            fetch_gnu "$tool/$tool-$ver.tar.xz" "$sha" "$tool-$ver.tar.xz"
            tar xJf "$tool-$ver.tar.xz"
            (cd "$tool-$ver" && ./configure --prefix="$HOME/.local" && make -j"$(nproc)" && make install)
          done
      - name: Add autotools to PATH
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Include system m4 files (for pkg.m4 etc)
          echo "ACLOCAL_PATH=/usr/share/aclocal:$HOME/.local/share/aclocal" >> "$GITHUB_ENV"
      - name: sccache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: native-${{ matrix.target }}-v3
          variant: sccache
      - name: Build Linux library
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.kind == 'linux'
        run: |
          ./native/${{ matrix.script }}
          mkdir -p native-out
          cp "$HOME/libarchive-native/${{ matrix.output }}" native-out/
          echo "=== sccache stats ==="
          sccache --show-stats
      - name: Build Windows DLL
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.kind == 'windows'
        run: |
          mkdir -p build-win native-out
          cd build-win
          # Unpack sources with bash first: build-windows.sh runs under /bin/sh and
          # only downloads them itself when they are missing.
          bash -c '. ../native/build-config.sh && download_all_libraries'
          PREFIX="$(pwd)/local" ARCH=${{ matrix.arch }} ../native/build-windows.sh
          cp ${{ matrix.output }} ../native-out/
          cd ..
          rm -rf build-win
          echo "=== sccache stats ==="
          sccache --show-stats
      - name: Save native binary to cache
        if: steps.native-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache/save@v6.1.0
        with:
          path: native-out/${{ matrix.output }}
          key: ${{ steps.cache-key.outputs.key }}
      - name: Archive native library
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: native-out/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 1

  package:
    name: Pack and test .NET package
    needs: [macos-cache, macos, native]
    # macos is skipped when its dylib was cached; macos-cache then supplies the artifact.
    if: >-
      ${{ !cancelled() && needs.native.result == 'success' &&
      (needs.macos-cache.outputs.hit == 'true' || needs.macos.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      package-version: ${{ steps.pack.outputs.PACKAGE_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Extract version from tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"
      - name: Retrieve native libraries
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          path: native-out
          merge-multiple: true
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6.1.0
      - name: Update Directory.Build.props for SDK version
        run: ./scripts/generate-build-props.sh
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: 'csharp'
          build-mode: manual
      - name: Assemble native runtimes
        run: |
          R=LibArchive.Net/runtimes
          mkdir -p "$R"/{osx-x64,osx-arm64,linux-x86,linux-musl-x86,linux-x64,linux-musl-x64,linux-arm,linux-musl-arm,linux-arm64,linux-musl-arm64,win-x86,win-x64,win-arm64}/native

          # Linux (musl-linked, so the same binary serves glibc and musl RIDs)
          for arch in x86 x64 arm64 arm; do
            cp "native-out/libarchive-linux-$arch.so" "$R/linux-$arch/native/libarchive.so"
            cp "native-out/libarchive-linux-$arch.so" "$R/linux-musl-$arch/native/libarchive.so"
          done

          # macOS universal binary
          cp native-out/libarchive.dylib "$R/osx-x64/native/"
          cp native-out/libarchive.dylib "$R/osx-arm64/native/"

          # Windows
          for arch in x86 x64 arm64; do
            cp "native-out/archive-$arch.dll" "$R/win-$arch/native/archive.dll"
          done

          ls -lR "$R"
      - name: Pack
        id: pack
        run: |
          dotnet pack LibArchive.Net/LibArchive.Net.csproj -o . "-p:PackageVersion=${{ steps.version.outputs.VERSION }}" --configuration Release --nologo

          # Extract package version for testing
          PACKAGE_FILE=$(ls LibArchive.Net.*.nupkg)
          PACKAGE_VERSION=${PACKAGE_FILE#LibArchive.Net.}
          PACKAGE_VERSION=${PACKAGE_VERSION%.nupkg}
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Test package (modern .NET)
        env:
          PACKAGE_VERSION: ${{ steps.pack.outputs.PACKAGE_VERSION }}
        run: |
          # Restore against the package just packed: source mapping pins LibArchive.Net to
          # this directory and an empty packages folder rules out any cached copy.
          ./scripts/write-package-test-nuget-config.sh . "$RUNNER_TEMP/nuget-test"
          dotnet restore Test.LibArchive.Net/Test.LibArchive.Net.csproj --configfile "$RUNNER_TEMP/nuget-test/nuget.config" -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"

          # Determine the modern .NET test target from the project (generated by scripts/generate-build-props.sh)
          TEST_TFMS=$(dotnet msbuild Test.LibArchive.Net/Test.LibArchive.Net.csproj -getProperty:TargetFrameworks -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION" | tail -1 | tr -d ' \r')
          TEST_TFM=$(echo "$TEST_TFMS" | tr ';' '\n' | grep -E '^net[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$TEST_TFM" ]; then
            echo "::error::No modern .NET target framework found in test project TargetFrameworks '$TEST_TFMS'"
            exit 1
          fi
          echo "Testing modern target framework: $TEST_TFM (from '$TEST_TFMS')"

          dotnet build Test.LibArchive.Net/Test.LibArchive.Net.csproj --framework "$TEST_TFM" --configuration Release --no-restore -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"
          dotnet test Test.LibArchive.Net/Test.LibArchive.Net.csproj --framework "$TEST_TFM" --configuration Release --no-build --nologo -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.3
      - name: Archive production artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: |
            *.nupkg
          if-no-files-found: error

  test-net462:
    name: Test package (.NET Framework 4.6.2 on Windows)
    needs: [package]
    # Explicit condition: the implicit success() would skip this job whenever the
    # (legitimately) skipped macos job is upstream.
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6.1.0
      - name: Retrieve package
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Test net462 against the package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.package-version }}
        run: |
          # LibArchive.Net may only come from dist (not a cache or nuget.org); see the script.
          ./scripts/write-package-test-nuget-config.sh dist "$RUNNER_TEMP/nuget-test"
          dotnet restore Test.LibArchive.Net/Test.LibArchive.Net.csproj --configfile "$RUNNER_TEMP/nuget-test/nuget.config" -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"
          dotnet test Test.LibArchive.Net/Test.LibArchive.Net.csproj --framework net462 --configuration Release --no-restore --nologo -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"

  # Required status check: the branch protection for main requires a check with exactly this
  # name, so do not rename it without updating the rule. The one job that used to carry the
  # name is now split across native, package and test-net462; this reports their combined
  # result (and macOS's), so the rule keeps gating everything it did before.
  build-and-test:
    name: Build Windows DLLs, Linux library, and test
    needs: [macos-cache, macos, native, package, test-net462]
    # always(): a skipped job counts as a passing required check, so this job must run and
    # fail explicitly when anything it depends on failed, was cancelled or was skipped.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check the build and test jobs
        env:
          MACOS_CACHE: ${{ needs.macos-cache.result }}
          MACOS_CACHE_HIT: ${{ needs.macos-cache.outputs.hit }}
          MACOS: ${{ needs.macos.result }}
          NATIVE: ${{ needs.native.result }}
          PACKAGE: ${{ needs.package.result }}
          TEST_NET462: ${{ needs.test-net462.result }}
        run: |
          echo "macos-cache=$MACOS_CACHE (hit=$MACOS_CACHE_HIT) macos=$MACOS native=$NATIVE package=$PACKAGE test-net462=$TEST_NET462"
          failed=0
          for result in "$MACOS_CACHE" "$NATIVE" "$PACKAGE" "$TEST_NET462"; do
            [ "$result" = "success" ] || failed=1
          done
          # The macOS build may only be skipped when its dylib came from the cache.
          if [ "$MACOS" != "success" ] && ! { [ "$MACOS" = "skipped" ] && [ "$MACOS_CACHE_HIT" = "true" ]; }; then
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::A build or test job did not succeed."
            exit 1
          fi
          echo "All build and test jobs succeeded."

  release:
    name: Publish release
    needs: [package, test-net462]
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.package.result == 'success' && needs.test-net462.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve package
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
      - name: Upload built packages
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: '*.nupkg'
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  # nuget.org Trusted Publishing: there is no stored API key. GitHub issues this job an OIDC
  # token, and NuGet/login exchanges it for an API key that is valid for one hour.
  #
  # The trusted publishing policy on nuget.org only accepts a token from this workflow file
  # (build.yml) running in the "nuget" environment, so renaming either one breaks publishing
  # until the policy is updated to match.
  #
  # Keep this job minimal: no checkout, and only GitHub's and NuGet's own actions. Any step
  # in a job that has "id-token: write" in this environment can obtain a key that publishes
  # packages, which is why the GitHub release upload above is a separate job.
  publish-nuget:
    name: Publish to nuget.org
    needs: [release]
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      id-token: write
    steps:
      - name: Retrieve package
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
      - name: Log in to nuget.org (OIDC token for a short-lived API key)
        id: login
        uses: NuGet/login@v1.2.0
        with:
          # The nuget.org account that owns the trusted publishing policy (profile name).
          user: jas88
      - name: Push package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
