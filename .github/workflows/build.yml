name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    # Weekly run on the default branch keeps its caches warm (GitHub evicts caches
    # unused for 7 days); PRs can only restore caches from their own ref or main.
    - cron: '0 6 * * 0'

# Cancel superseded runs of the same PR; never cancel main, tag or scheduled runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Bump to invalidate every cached native binary and configure result (e.g. after a
  # runner toolchain change that native/** does not capture).
  NATIVE_CACHE_VERSION: v1
  # LLVM-MinGW (win-arm64 only) and the SHA-256 of its release asset
  # llvm-mingw-<version>-ucrt-ubuntu-20.04-x86_64.tar.xz: update the two together.
  # The release publishes no checksum, so the hash is of the asset as downloaded.
  LLVM_MINGW_VERSION: '20240619'
  LLVM_MINGW_SHA256: 27d33157cc252c29ad6f777a96a0d94176fea1b534ff09b5071485def143b90e
  # xz 5.8.2 was built with automake 1.18.1 and autoconf 2.72
  AUTOCONF_VERSION: '2.72'
  AUTOCONF_SHA256: ba885c1319578d6c94d46e9b0dceb4014caafe2490e437a0dbca3f270a223f5a
  AUTOMAKE_VERSION: '1.18.1'
  AUTOMAKE_SHA256: 168aa363278351b89af56684448f525a5bce5079d0b6842bd910fdd3f1646887

jobs:
  # Look up the cached macOS dylib on Ubuntu so a macOS runner is only requested when
  # the dylib actually needs rebuilding (macOS runners are scarcer and less reliable).
  macos-cache:
    name: Check cached macOS dylib
    runs-on: ubuntu-24.04
    outputs:
      hit: ${{ steps.native-cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      # Tag builds always rebuild from source so release binaries never come from a cache.
      - name: Restore cached macOS dylib
        id: native-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: native-out/libarchive.dylib
          key: native-osx-universal-${{ env.NATIVE_CACHE_VERSION }}-${{ hashFiles('native/**') }}
          # Saved on macOS, restored on Ubuntu; the save step sets the same flag.
          enableCrossOsArchive: true
      - name: Archive macOS library
        if: steps.native-cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-osx-universal
          path: native-out/libarchive.dylib
          if-no-files-found: error
          retention-days: 1

  macos:
    # This exact name is a required status check in the branch protection for main: do not
    # rename it (even its capitalisation) without updating the rule.
    name: Build MacOS dylib (x86-64 and arm64)
    needs: [macos-cache]
    if: needs.macos-cache.outputs.hit != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Cache library downloads
        uses: actions/cache@v6.1.0
        with:
          # DOWNLOAD_CACHE in native/build-config.sh: this path unless XDG_CACHE_HOME
          # names another directory (the build log prints the one in use)
          path: ~/.cache/libarchive-net/downloads
          # One cache per job (see the native job's download cache)
          key: library-downloads-osx-universal-${{ hashFiles('native/build-config.sh') }}
          restore-keys: |
            library-downloads-osx-universal-
      - name: Cache configure results
        uses: actions/cache@v6.1.0
        with:
          # CONFIG_CACHE_DIR in native/build-config.sh (see the download cache above)
          path: ~/.cache/libarchive-net/config-cache
          # Exact match only: a configure cache from another toolchain or flag set makes
          # autoconf abort ("`CC' has changed since the previous run").
          key: config-cache-macos-${{ env.NATIVE_CACHE_VERSION }}-${{ hashFiles('native/build-*.sh') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: macos-build-v2
        env:
          CCACHE_COMPILERCHECK: mtime
      - name: Build
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export CC="ccache clang"
          export CXX="ccache clang++"

          echo "=== ccache stats before build ==="
          ccache -s

          ./native/build-macos.sh

          echo "=== ccache stats after build ==="
          ccache -s

          mkdir -p native-out
          cp ~/libarchive-native/libarchive.dylib native-out/
      - name: Save native binary to cache
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/save@v6.1.0
        with:
          path: native-out/libarchive.dylib
          key: native-osx-universal-${{ env.NATIVE_CACHE_VERSION }}-${{ hashFiles('native/**') }}
          enableCrossOsArchive: true
      - name: Archive macOS library
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-osx-universal
          path: native-out/libarchive.dylib
          if-no-files-found: error
          retention-days: 1

  native:
    name: Build native ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # One library per Linux runtime, each linked against its own C library (glibc for
          # linux-*, musl for linux-musl-*), built by native/build-linux.sh <target>, with
          # loadtest-<target>, the load test program built for it, beside it
          - target: linux-x64
            kind: linux
            output: libarchive-linux-x64.so
          - target: linux-arm64
            kind: linux
            output: libarchive-linux-arm64.so
            # test_load_glibc (native/build-linux-common.sh) runs the load test under QEMU,
            # with the dynamic loader and libraries of this package's glibc
            glibc-cross-runtime: libc6-arm64-cross
            # GNU binutils for the target, which the build takes from binutils-dir, where
            # this package puts them under their unprefixed names (BINUTILS_DIR; see
            # setup_linux_tools in native/build-linux-common.sh). The runner's own binutils
            # are built for x86 only, so the x64 rows use those.
            binutils: binutils-aarch64-linux-gnu
            binutils-dir: /usr/aarch64-linux-gnu/bin
          - target: linux-arm
            kind: linux
            output: libarchive-linux-arm.so
            glibc-cross-runtime: libc6-armhf-cross
            binutils: binutils-arm-linux-gnueabihf
            binutils-dir: /usr/arm-linux-gnueabihf/bin
          - target: linux-musl-x64
            kind: linux
            output: libarchive-linux-musl-x64.so
          - target: linux-musl-arm64
            kind: linux
            output: libarchive-linux-musl-arm64.so
            binutils: binutils-aarch64-linux-gnu
            binutils-dir: /usr/aarch64-linux-gnu/bin
          - target: linux-musl-arm
            kind: linux
            output: libarchive-linux-musl-arm.so
            binutils: binutils-arm-linux-gnueabihf
            binutils-dir: /usr/arm-linux-gnueabihf/bin
          - target: win-x86
            kind: windows
            arch: x86
            output: archive-x86.dll
          - target: win-x64
            kind: windows
            arch: x64
            output: archive-x64.dll
          - target: win-arm64
            kind: windows
            arch: arm64
            output: archive-arm64.dll
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Compute cache keys
        id: cache-key
        run: |
          # LLVM-MinGW only matters to win-arm64, so only that target's keys carry it.
          EXTRA=""
          if [ "${{ matrix.target }}" = "win-arm64" ]; then
            EXTRA="llvm-mingw-${LLVM_MINGW_VERSION}-"
          fi
          {
            echo "key=native-${{ matrix.target }}-${EXTRA}${NATIVE_CACHE_VERSION}-${{ hashFiles('native/**') }}"
            # Configure results are only valid for the toolchain that produced them, so
            # their key carries the same toolchain parts as the binary's (for Linux, zig's
            # version in build-config.sh and the compiler wrapper).
            echo "config-key=config-cache-${{ matrix.target }}-${EXTRA}${NATIVE_CACHE_VERSION}-${{ hashFiles('native/build-*.sh', 'native/zig-cc.sh') }}"
          } >> "$GITHUB_OUTPUT"
      # Native binaries are reused while native/** is unchanged. Tag builds always
      # rebuild from source so release binaries never come from a cache.
      - name: Restore cached native binary
        id: native-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/restore@v6.1.0
        with:
          # A Linux library comes with its load test program (see the matrix)
          path: |
            native-out/${{ matrix.output }}
            ${{ matrix.kind == 'linux' && format('native-out/loadtest-{0}', matrix.target) || '' }}
          key: ${{ steps.cache-key.outputs.key }}
      - name: Cache library downloads
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          # DOWNLOAD_CACHE in native/build-config.sh: this path unless XDG_CACHE_HOME
          # names another directory (the build log prints the one in use)
          path: ~/.cache/libarchive-net/downloads
          # One cache per job, because each job downloads different files (only the
          # Linux jobs fetch zig and mbedTLS). With one key for all of
          # them, only the first job to finish could save the cache, and runs that hit
          # the key never save it again, so the cache held that one job's downloads.
          key: library-downloads-${{ matrix.target }}-${{ hashFiles('native/build-config.sh') }}
          restore-keys: |
            library-downloads-${{ matrix.target }}-
      - name: Cache configure results
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          # CONFIG_CACHE_DIR in native/build-config.sh (see the download cache above)
          path: ~/.cache/libarchive-net/config-cache
          # Exact match only: a configure cache from another toolchain or flag set makes
          # autoconf abort ("`CC' has changed since the previous run").
          key: ${{ steps.cache-key.outputs.config-key }}
      # zig's own cache, of the C library stubs and compiler-rt that it builds for each
      # target. The Linux builds have no sccache: it cannot sit in front of zig cc.
      - name: Cache zig's builds of the C library and compiler-rt
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.kind == 'linux'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/zig
          key: zig-cache-${{ matrix.target }}-${{ hashFiles('native/build-config.sh', 'native/build-linux.sh', 'native/zig-cc.sh') }}
          restore-keys: |
            zig-cache-${{ matrix.target }}-
      - name: Install apt packages
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          # The lzop shim is C++. mingw-w64 brings only the C compilers here, so add the
          # C++ ones, in the "win32" thread model of the default C compilers.
          packages: ${{ matrix.kind == 'windows' && 'mingw-w64 g++-mingw-w64-i686-win32 g++-mingw-w64-x86-64-win32 pkg-config' || 'pkg-config' }}
          version: 1.0
          execute_install_scripts: true
      # The glibc arm and arm64 builds load-test the library under QEMU user-mode emulation,
      # with the dynamic loader and libraries of Ubuntu's cross runtime of glibc
      # (test_load_glibc in native/build-linux-common.sh), and fail if either is missing.
      - name: Install QEMU user-mode emulation
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.glibc-cross-runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user ${{ matrix.glibc-cross-runtime }}
      # The arm and arm64 builds run GNU binutils for their target (see the matrix)
      - name: Install GNU binutils for the target
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.binutils }}
      - name: Install LLVM-MinGW for ARM64
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.target == 'win-arm64'
        run: |
          LLVM_MINGW="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64"
          ARCHIVE="$RUNNER_TEMP/${LLVM_MINGW}.tar.xz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$ARCHIVE" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW}.tar.xz"
          # Verified before anything is unpacked; a mismatch fails the job
          echo "${LLVM_MINGW_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar xJf "$ARCHIVE" -C "$RUNNER_TEMP"
          rm -f "$ARCHIVE"
          echo "$RUNNER_TEMP/${LLVM_MINGW}/bin" >> "$GITHUB_PATH"
      - name: Verify MinGW compilers are installed
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.kind == 'windows'
        run: |
          case "${{ matrix.arch }}" in
            x86)   PREFIX=i686-w64-mingw32 ;;
            x64)   PREFIX=x86_64-w64-mingw32 ;;
            arm64) PREFIX=aarch64-w64-mingw32 ;;
          esac
          # build-windows.sh uses <prefix>-gcc-win32 and <prefix>-g++-win32 where they
          # exist and the plain names otherwise; one of each must be present
          for tool in gcc g++; do
            command -v "$PREFIX-$tool-win32" || command -v "$PREFIX-$tool"
          done
      - name: Cache autotools
        id: autotools-cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local
          key: autotools-ubuntu-24.04-autoconf-${{ env.AUTOCONF_VERSION }}-automake-${{ env.AUTOMAKE_VERSION }}
      - name: Install autoconf and automake
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.autotools-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          # Download with checksum verification; fall back to canonical ftp.gnu.org
          # if a mirror serves a bad/corrupt file.
          fetch_gnu() {
            local path="$1" sha="$2" out="$3"
            for url in "https://ftpmirror.gnu.org/gnu/$path" "https://ftp.gnu.org/gnu/$path"; do
              echo "Fetching $url"
              curl -fsSL --retry 3 --retry-delay 5 "$url" -o "$out" || continue
              if echo "$sha  $out" | sha256sum -c --status; then
                echo "Checksum OK from $url"
                return 0
              fi
              echo "Checksum mismatch from $url, trying next source"
              rm -f "$out"
            done
            echo "All sources failed for $path" >&2
            return 1
          }
          for tool in autoconf automake; do
            if [ "$tool" = autoconf ]; then
              ver="$AUTOCONF_VERSION"; sha="$AUTOCONF_SHA256"
            else
              ver="$AUTOMAKE_VERSION"; sha="$AUTOMAKE_SHA256"
            fi
            fetch_gnu "$tool/$tool-$ver.tar.xz" "$sha" "$tool-$ver.tar.xz"
            tar xJf "$tool-$ver.tar.xz"
            (cd "$tool-$ver" && ./configure --prefix="$HOME/.local" && make -j"$(nproc)" && make install)
          done
      - name: Add autotools to PATH
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Include system m4 files (for pkg.m4 etc)
          echo "ACLOCAL_PATH=/usr/share/aclocal:$HOME/.local/share/aclocal" >> "$GITHUB_ENV"
      - name: sccache
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.kind == 'windows'
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: native-${{ matrix.target }}-v3
          variant: sccache
      - name: Build Linux library
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.kind == 'linux'
        env:
          # Empty for the x64 rows, for which the build takes binutils from PATH
          BINUTILS_DIR: ${{ matrix.binutils-dir }}
        run: |
          ./native/build-linux.sh ${{ matrix.target }}
          mkdir -p native-out
          cp "$HOME/libarchive-native/${{ matrix.output }}" "$HOME/libarchive-native/loadtest-${{ matrix.target }}" native-out/
      - name: Build Windows DLL
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.kind == 'windows'
        run: |
          mkdir -p build-win native-out
          cd build-win
          # build-windows.sh downloads (into the cache) and unpacks the sources itself
          PREFIX="$(pwd)/local" ARCH=${{ matrix.arch }} ../native/build-windows.sh
          cp ${{ matrix.output }} ../native-out/
          cd ..
          rm -rf build-win
          echo "=== sccache stats ==="
          sccache --show-stats
      - name: Save native binary to cache
        if: steps.native-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            native-out/${{ matrix.output }}
            ${{ matrix.kind == 'linux' && format('native-out/loadtest-{0}', matrix.target) || '' }}
          key: ${{ steps.cache-key.outputs.key }}
      - name: Archive native library
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: |
            native-out/${{ matrix.output }}
            ${{ matrix.kind == 'linux' && format('native-out/loadtest-{0}', matrix.target) || '' }}
          if-no-files-found: error
          retention-days: 1

  # Loads each Linux library in containers, with its load test program (loadtest-<rid>, which
  # the native job builds for the same target and uploads with the library; see
  # native/linux-loadtest.c): in the oldest distribution of its C library that can be tested,
  # and in a current one. The arm64 and arm containers run under QEMU user-mode emulation. In
  # one row the library must not load: the linux-arm library needs glibc 2.34, so the dynamic
  # loader of Debian 11 (glibc 2.31) must refuse it.
  linux-load-test:
    name: Load test ${{ matrix.rid }} in ${{ matrix.distro }}${{ matrix.expect == 'refused' && ' (must be refused)' || '' }}
    needs: [native]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # image is pinned by the digest of its index, which covers every platform, with the
        # tag beside it; distro is that tag, for the job's name. expect is "loads", or
        # "refused" for a C library older than the library's baseline (see
        # native/build-linux.sh).
        include:
          # glibc 2.28 (RHEL 8), the baseline of linux-x64 and linux-arm64, and glibc 2.41
          - rid: linux-x64
            distro: almalinux:8
            image: almalinux@sha256:768bedc30fe0a536adb0a65d2eddb7caad364e514fbddd0ae9e026975f590342  # almalinux:8
            platform: linux/amd64
            expect: loads
          - rid: linux-x64
            distro: debian:13
            image: debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6  # debian:13
            platform: linux/amd64
            expect: loads
          # glibc 2.28 and 2.39
          - rid: linux-arm64
            distro: almalinux:8
            image: almalinux@sha256:768bedc30fe0a536adb0a65d2eddb7caad364e514fbddd0ae9e026975f590342  # almalinux:8
            platform: linux/arm64
            expect: loads
          - rid: linux-arm64
            distro: ubuntu:24.04
            image: ubuntu@sha256:9c7f200c07e3d4a03e7249d2c16bf66a51120fb876aa2242cf31451412543289  # ubuntu:24.04
            platform: linux/arm64
            expect: loads
          # glibc 2.35, the oldest armhf glibc that can be tested (the library's baseline is
          # 2.34), and glibc 2.41
          - rid: linux-arm
            distro: ubuntu:22.04
            image: ubuntu@sha256:f64b2ffc2f10ab8f8505aa56b2664bd846cbb9df87c7e2532e30f7667021c0e6  # ubuntu:22.04
            platform: linux/arm/v7
            expect: loads
          - rid: linux-arm
            distro: debian:13
            image: debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6  # debian:13
            platform: linux/arm/v7
            expect: loads
          # glibc 2.31, older than the library's baseline
          - rid: linux-arm
            distro: debian:11
            image: debian@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9  # debian:11
            platform: linux/arm/v7
            expect: refused
          # musl 1.2.5 (Alpine 3.21), the baseline of the musl libraries, and musl 1.2.6
          - rid: linux-musl-x64
            distro: alpine:3.21
            image: alpine@sha256:bc21487101ae47172509130ee1092cc273a831968d64b617776d1f69c81e42ab  # alpine:3.21
            platform: linux/amd64
            expect: loads
          - rid: linux-musl-x64
            distro: alpine:3.24
            image: alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf  # alpine:3.24
            platform: linux/amd64
            expect: loads
          - rid: linux-musl-arm64
            distro: alpine:3.21
            image: alpine@sha256:bc21487101ae47172509130ee1092cc273a831968d64b617776d1f69c81e42ab  # alpine:3.21
            platform: linux/arm64
            expect: loads
          - rid: linux-musl-arm64
            distro: alpine:3.24
            image: alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf  # alpine:3.24
            platform: linux/arm64
            expect: loads
          - rid: linux-musl-arm
            distro: alpine:3.21
            image: alpine@sha256:bc21487101ae47172509130ee1092cc273a831968d64b617776d1f69c81e42ab  # alpine:3.21
            platform: linux/arm/v7
            expect: loads
          - rid: linux-musl-arm
            distro: alpine:3.24
            image: alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf  # alpine:3.24
            platform: linux/arm/v7
            expect: loads
    env:
      RID: ${{ matrix.rid }}
      DISTRO: ${{ matrix.distro }}
      IMAGE: ${{ matrix.image }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Retrieve the library and its load test program
        uses: actions/download-artifact@v8.0.2
        with:
          name: native-${{ matrix.rid }}
          path: work
      # Artifacts do not keep file modes
      - name: Make the load test program executable
        run: chmod +x "work/loadtest-$RID"
      # Registers QEMU's user-mode emulators with binfmt_misc, so that the arm64 and arm
      # containers run on this x64 runner
      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0  # tonistiigi/binfmt:latest (qemu-v10.2.3-68)
          platforms: arm64,arm
      # Pulled in a step of its own, so that the load test's output is the program's alone,
      # and retried, as a pull can fail for a moment: up to 4 attempts, 5 seconds apart, as
      # the native job's downloads make
      - name: Pull ${{ matrix.distro }} for ${{ matrix.platform }}
        run: |
          for attempt in 1 2 3 4; do
            if docker pull --platform "$PLATFORM" "$IMAGE"; then
              exit 0
            fi
            echo "docker pull failed (attempt $attempt of 4)"
            [ "$attempt" -eq 4 ] || sleep 5
          done
          exit 1
      # The program exits non-zero unless the library loads, with every symbol bound at once,
      # and passes every check. It runs as root, in /work, the artifact's directory, mounted
      # read-write; it writes its own files in the container's /tmp.
      - name: Run the load test
        if: matrix.expect == 'loads'
        run: |
          docker run --rm --platform "$PLATFORM" --user 0:0 -v "$PWD/work:/work" -w /work "$IMAGE" \
            "./loadtest-$RID" "./libarchive-$RID.so"
      # The program, run as above, must fail, with the dynamic loader's refusal of the library
      # for a glibc version that this glibc lacks. In Debian 11 armhf that is the line
      # FAIL: dlopen ./libarchive-linux-arm.so: /lib/arm-linux-gnueabihf/libc.so.6: version `GLIBC_2.32' not found (required by ./libarchive-linux-arm.so)
      # The program itself needs glibc 2.28 only, so that it starts, and the library is what
      # is refused (see native/build-linux.sh).
      - name: Check that the library is refused
        if: matrix.expect == 'refused'
        run: |
          status=0
          output=$(docker run --rm --platform "$PLATFORM" --user 0:0 -v "$PWD/work:/work" -w /work "$IMAGE" \
            "./loadtest-$RID" "./libarchive-$RID.so" 2>&1) || status=$?
          printf '%s\n' "$output"
          echo "Exit status: $status"
          if [ "$status" -eq 0 ]; then
            echo "::error::The load test passed in $DISTRO, whose glibc is older than the library's baseline: the library must be refused"
            exit 1
          fi
          # Whatever the glibc version and the C library's path: one line must name a glibc
          # version as not found, and then the library as the file that needs it
          if ! printf '%s\n' "$output" | awk -v lib="./libarchive-$RID.so" '
              { v = index($0, "version `GLIBC_"); n = index($0, "not found (required by " lib ")") }
              v > 0 && n > v { found = 1 }
              END { exit !found }'; then
            echo "::error::The load test failed in $DISTRO, but not because the dynamic loader refused the library for a glibc version (see the output above)"
            exit 1
          fi
          echo "The dynamic loader of $DISTRO refused the library, as it must."

  package:
    name: Pack and test .NET package
    needs: [macos-cache, macos, native]
    # macos is skipped when its dylib was cached; macos-cache then supplies the artifact.
    if: >-
      ${{ !cancelled() && needs.native.result == 'success' &&
      (needs.macos-cache.outputs.hit == 'true' || needs.macos.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      package-version: ${{ steps.pack.outputs.PACKAGE_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Extract version from tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"
      - name: Retrieve native libraries
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          path: native-out
          merge-multiple: true
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6.1.0
      - name: Update Directory.Build.props for SDK version
        run: ./scripts/generate-build-props.sh
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: 'csharp'
          build-mode: manual
      - name: Assemble native runtimes
        run: |
          R=LibArchive.Net/runtimes
          mkdir -p "$R"/{osx-x64,osx-arm64,linux-x64,linux-musl-x64,linux-arm,linux-musl-arm,linux-arm64,linux-musl-arm64,win-x86,win-x64,win-arm64}/native

          # Linux: a library of its own for each runtime, linked against its C library
          for rid in linux-x64 linux-arm64 linux-arm linux-musl-x64 linux-musl-arm64 linux-musl-arm; do
            cp "native-out/libarchive-$rid.so" "$R/$rid/native/libarchive.so"
          done

          # macOS universal binary
          cp native-out/libarchive.dylib "$R/osx-x64/native/"
          cp native-out/libarchive.dylib "$R/osx-arm64/native/"

          # Windows
          for arch in x86 x64 arm64; do
            cp "native-out/archive-$arch.dll" "$R/win-$arch/native/archive.dll"
          done

          ls -lR "$R"
      # Each Linux library must export libarchive's API alone, and every function that
      # LibArchive.Net imports from it (native/verify-exports.sh)
      - name: Check the exports of the Linux libraries
        run: ./native/verify-exports.sh LibArchive.Net/runtimes/linux-*/native/libarchive.so
      # Each Linux library must be in the folder of its own runtime: built for its architecture,
      # and linked against its runtime's C library (native/verify-linux-runtimes.sh). The tests
      # would not tell, as musl loads the glibc linux-x64 library too.
      - name: Check the runtime of each Linux library
        run: ./native/verify-linux-runtimes.sh LibArchive.Net/runtimes
      - name: Pack
        id: pack
        run: |
          dotnet pack LibArchive.Net/LibArchive.Net.csproj -o . "-p:PackageVersion=${{ steps.version.outputs.VERSION }}" --configuration Release --nologo

          # Extract package version for testing
          PACKAGE_FILE=$(ls LibArchive.Net.*.nupkg)
          PACKAGE_VERSION=${PACKAGE_FILE#LibArchive.Net.}
          PACKAGE_VERSION=${PACKAGE_VERSION%.nupkg}
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Test package (modern .NET)
        env:
          PACKAGE_VERSION: ${{ steps.pack.outputs.PACKAGE_VERSION }}
          # The runtime whose native library the tests must find loaded (see LoadedLibraryTests.cs)
          LIBARCHIVE_NET_EXPECT_RID: linux-x64
        run: |
          # Restore against the package just packed: source mapping pins LibArchive.Net to
          # this directory and an empty packages folder rules out any cached copy.
          ./scripts/write-package-test-nuget-config.sh . "$RUNNER_TEMP/nuget-test"
          dotnet restore Test.LibArchive.Net/Test.LibArchive.Net.csproj --configfile "$RUNNER_TEMP/nuget-test/nuget.config" -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"

          # Determine the modern .NET test target from the project (generated by scripts/generate-build-props.sh)
          TEST_TFMS=$(dotnet msbuild Test.LibArchive.Net/Test.LibArchive.Net.csproj -getProperty:TargetFrameworks \
            -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION" | tail -1 | tr -d ' \r')
          TEST_TFM=$(echo "$TEST_TFMS" | tr ';' '\n' | grep -E '^net[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$TEST_TFM" ]; then
            echo "::error::No modern .NET target framework found in test project TargetFrameworks '$TEST_TFMS'"
            exit 1
          fi
          echo "Testing modern target framework: $TEST_TFM (from '$TEST_TFMS')"

          dotnet build Test.LibArchive.Net/Test.LibArchive.Net.csproj --framework "$TEST_TFM" --configuration Release --no-restore -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"
          dotnet test Test.LibArchive.Net/Test.LibArchive.Net.csproj --framework "$TEST_TFM" --configuration Release --no-build --nologo \
            -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.3
      - name: Archive production artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: |
            *.nupkg
          if-no-files-found: error

  # Tests the package on Windows for .NET Framework 4.6.2 (the library's .NET Standard 2.0
  # build) and for the modern .NET target (its newest build), which the package job tests on
  # Linux. The job keeps its name and id, which other checks and jobs refer to.
  test-net462:
    name: Test package (.NET Framework 4.6.2 on Windows)
    needs: [package]
    # Explicit condition: the implicit success() would skip this job whenever the
    # (legitimately) skipped macos job is upstream.
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6.1.0
      - name: Retrieve package
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Restore the tests against the package
        id: restore
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.package-version }}
        run: |
          # LibArchive.Net may only come from dist (not a cache or nuget.org); see the script.
          ./scripts/write-package-test-nuget-config.sh dist "$RUNNER_TEMP/nuget-test"
          dotnet restore Test.LibArchive.Net/Test.LibArchive.Net.csproj --configfile "$RUNNER_TEMP/nuget-test/nuget.config" -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"
      - name: Test net462 against the package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.package-version }}
        run: |
          dotnet test Test.LibArchive.Net/Test.LibArchive.Net.csproj --framework net462 --configuration Release --no-restore --nologo -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"
      # Runs whether or not the net462 tests passed, so that a failure shows for each framework.
      - name: Test the modern .NET target against the package
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.package-version }}
        run: |
          # Determine the modern .NET test target from the project, as the package job does
          TEST_TFMS=$(dotnet msbuild Test.LibArchive.Net/Test.LibArchive.Net.csproj -getProperty:TargetFrameworks \
            -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION" | tail -1 | tr -d ' \r')
          TEST_TFM=$(echo "$TEST_TFMS" | tr ';' '\n' | grep -E '^net[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$TEST_TFM" ]; then
            echo "::error::No modern .NET target framework found in test project TargetFrameworks '$TEST_TFMS'"
            exit 1
          fi
          echo "Testing modern target framework: $TEST_TFM (from '$TEST_TFMS')"

          dotnet test Test.LibArchive.Net/Test.LibArchive.Net.csproj --framework "$TEST_TFM" --configuration Release --no-restore --nologo \
            -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"

  # Tests the package in Alpine on x64, where .NET loads the linux-musl-x64 library, as the
  # package job's tests on Ubuntu load linux-x64's. The tests run in a container that a step
  # starts, not in a container job, because GitHub's JavaScript actions (checkout, artifacts)
  # do not run in Alpine.
  test-alpine:
    name: Test package (.NET on Alpine x64)
    needs: [package]
    # Explicit condition: the implicit success() would skip this job whenever the
    # (legitimately) skipped macos job is upstream.
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      # Alpine 3.24.4, as the .NET SDK's image for it has it, pinned by the digest of its index,
      # for the system libraries that .NET needs there (ICU, libstdc++, OpenSSL and so on). The
      # image's own SDK, 11.0.100, goes unused: the test step mounts the SDK that global.json
      # names over it (see the install step). It has no bash, so what runs in it is POSIX sh,
      # for its BusyBox ash.
      ALPINE_IMAGE: mcr.microsoft.com/dotnet/sdk@sha256:52556c0fb9d0f609ae9aeab9efeeba96f4acc2f7038f7696f2235ccbdbb8e290  # 11.0-alpine, also 11.0-alpine3.24
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      # The .NET SDK of the version that global.json names, built for musl, from dotnet-install,
      # the script that setup-dotnet runs too. The image's SDK is pinned with the image, so once
      # Dependabot moved global.json on to a newer SDK, the container would have none that
      # global.json allows; this one follows global.json. dotnet-install is a bash script, so
      # it runs here, where the SDK that it installs cannot run: that runs in the container.
      - name: Install the .NET SDK for musl
        id: sdk
        run: |
          if ! version=$(jq -er '.sdk.version' global.json); then
            echo "::error::global.json names no .NET SDK version (sdk.version)"
            exit 1
          fi
          dir="$RUNNER_TEMP/dotnet-musl"
          if ! curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh ||
            ! bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --os linux-musl --architecture x64 --install-dir "$dir" --no-path; then
            echo "::error::Could not install the .NET SDK $version for linux-musl-x64, the version that global.json names"
            exit 1
          fi
          if [ ! -x "$dir/dotnet" ] || [ ! -d "$dir/sdk/$version" ]; then
            echo "::error::dotnet-install did not install the .NET SDK $version for linux-musl-x64 in $dir"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Retrieve package
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      # LibArchive.Net may only come from dist (not a cache or nuget.org); see the script. It is
      # a bash script, so it runs here, not in the container, which sees the paths that it
      # writes into nuget.config at the same paths (see the test step).
      - name: Write the NuGet config for the package
        run: ./scripts/write-package-test-nuget-config.sh dist "$RUNNER_TEMP/nuget-test"
      # Retried as the load test job's pulls are: up to 4 attempts, 5 seconds apart
      - name: Pull the Alpine image
        run: |
          for attempt in 1 2 3 4; do
            if docker pull "$ALPINE_IMAGE"; then
              exit 0
            fi
            echo "docker pull failed (attempt $attempt of 4)"
            [ "$attempt" -eq 4 ] || sleep 5
          done
          exit 1
      # The restore, build and test commands of the package job's "Test package (modern .NET)"
      # step, in the Alpine image. The checkout (with dist) and the NuGet config's directory are
      # mounted at their paths here, so that the paths in nuget.config hold in the container.
      # The SDK of the install step is mounted, read-only, over the image's own in
      # /usr/share/dotnet, which /usr/bin/dotnet links to, so that nothing in the container can
      # run the image's; the script stops unless dotnet is that SDK.
      # The container runs as the runner's user, not as root, so that every file it writes
      # there (the restored packages, bin and obj) belongs to that user, as the other steps'
      # files do; HOME, for the SDK's and NuGet's own files, is in the container's /tmp, which
      # goes with the container.
      - name: Test the package in Alpine
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.package-version }}
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
          SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: |
          cat > "$RUNNER_TEMP/test-alpine.sh" <<'EOF'
          # No pipefail, so that a TEST_TFM that is not found reaches its error message below
          set -eu
          mkdir -p "$HOME"
          if ! sdk=$(dotnet --version); then
            echo "::error::The .NET SDK $SDK_VERSION, which global.json names, does not run in the container"
            exit 1
          fi
          if [ "$sdk" != "$SDK_VERSION" ]; then
            echo "::error::The container runs the .NET SDK $sdk, not $SDK_VERSION, which global.json names"
            exit 1
          fi
          dotnet --info
          dotnet restore Test.LibArchive.Net/Test.LibArchive.Net.csproj --configfile "$TEST_NUGET_CONFIG" -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"

          # Determine the modern .NET test target from the project, as the package job does
          TEST_TFMS=$(dotnet msbuild Test.LibArchive.Net/Test.LibArchive.Net.csproj -getProperty:TargetFrameworks \
            -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION" | tail -n 1 | tr -d ' \r')
          TEST_TFM=$(echo "$TEST_TFMS" | tr ';' '\n' | grep -E '^net[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$TEST_TFM" ]; then
            echo "::error::No modern .NET target framework found in test project TargetFrameworks '$TEST_TFMS'"
            exit 1
          fi
          echo "Testing modern target framework: $TEST_TFM (from '$TEST_TFMS')"

          dotnet build Test.LibArchive.Net/Test.LibArchive.Net.csproj --framework "$TEST_TFM" --configuration Release --no-restore -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"
          dotnet test Test.LibArchive.Net/Test.LibArchive.Net.csproj --framework "$TEST_TFM" --configuration Release --no-build --nologo \
            -p:UseLocalPackage=true "-p:LibArchiveNetVersion=$PACKAGE_VERSION"
          EOF
          # LIBARCHIVE_NET_EXPECT_RID: the runtime whose native library the tests must find loaded
          # (see LoadedLibraryTests.cs)
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home -e PACKAGE_VERSION -e SDK_VERSION -e TEST_NUGET_CONFIG="$RUNNER_TEMP/nuget-test/nuget.config" \
            -e LIBARCHIVE_NET_EXPECT_RID=linux-musl-x64 -e CI -e GITHUB_ACTIONS \
            -v "$SDK_DIR:/usr/share/dotnet:ro" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP/nuget-test:$RUNNER_TEMP/nuget-test" \
            -v "$RUNNER_TEMP/test-alpine.sh:/test-alpine.sh:ro" -w "$GITHUB_WORKSPACE" \
            "$ALPINE_IMAGE" sh /test-alpine.sh

  # Required status check: the branch protection for main requires a check with exactly this
  # name, so do not rename it without updating the rule. The one job that used to carry the
  # name is now split across native, package and test-net462; this reports their combined
  # result (and macOS's), so the rule keeps gating everything it did before, and the result
  # of the jobs added since: linux-load-test and test-alpine.
  build-and-test:
    name: Build Windows DLLs, Linux library, and test
    needs: [macos-cache, macos, native, linux-load-test, package, test-net462, test-alpine]
    # always(): a skipped job counts as a passing required check, so this job must run and
    # fail explicitly when anything it depends on failed, was cancelled or was skipped.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check the build and test jobs
        env:
          MACOS_CACHE: ${{ needs.macos-cache.result }}
          MACOS_CACHE_HIT: ${{ needs.macos-cache.outputs.hit }}
          MACOS: ${{ needs.macos.result }}
          NATIVE: ${{ needs.native.result }}
          LINUX_LOAD_TEST: ${{ needs.linux-load-test.result }}
          PACKAGE: ${{ needs.package.result }}
          TEST_NET462: ${{ needs.test-net462.result }}
          TEST_ALPINE: ${{ needs.test-alpine.result }}
        run: |
          echo "macos-cache=$MACOS_CACHE (hit=$MACOS_CACHE_HIT) macos=$MACOS native=$NATIVE linux-load-test=$LINUX_LOAD_TEST package=$PACKAGE test-net462=$TEST_NET462 test-alpine=$TEST_ALPINE"
          failed=0
          for result in "$MACOS_CACHE" "$NATIVE" "$LINUX_LOAD_TEST" "$PACKAGE" "$TEST_NET462" "$TEST_ALPINE"; do
            [ "$result" = "success" ] || failed=1
          done
          # The macOS build may only be skipped when its dylib came from the cache.
          if [ "$MACOS" != "success" ] && ! { [ "$MACOS" = "skipped" ] && [ "$MACOS_CACHE_HIT" = "true" ]; }; then
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::A build or test job did not succeed."
            exit 1
          fi
          echo "All build and test jobs succeeded."

  release:
    name: Publish release
    needs: [package, test-net462, linux-load-test, test-alpine]
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.package.result == 'success' && needs.test-net462.result == 'success' &&
      needs.linux-load-test.result == 'success' && needs.test-alpine.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve package
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
      - name: Upload built packages
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: '*.nupkg'
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  # nuget.org Trusted Publishing: there is no stored API key. GitHub issues this job an OIDC
  # token, and NuGet/login exchanges it for an API key that is valid for one hour.
  #
  # The trusted publishing policy on nuget.org only accepts a token from this workflow file
  # (build.yml) running in the "nuget" environment, so renaming either one breaks publishing
  # until the policy is updated to match.
  #
  # Keep this job minimal: no checkout, and only GitHub's and NuGet's own actions. Any step
  # in a job that has "id-token: write" in this environment can obtain a key that publishes
  # packages, which is why the GitHub release upload above is a separate job.
  publish-nuget:
    name: Publish to nuget.org
    needs: [release]
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      id-token: write
    steps:
      - name: Retrieve package
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
      - name: Log in to nuget.org (OIDC token for a short-lived API key)
        id: login
        uses: NuGet/login@v1.2.0
        with:
          # The nuget.org account that owns the trusted publishing policy (profile name).
          user: jas88
      - name: Push package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
